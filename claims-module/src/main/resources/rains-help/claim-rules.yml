id: claim-rules
title: Claim rules (flags)
summary: PvP, fire, mobs, explosions, fall damage, hunger and more — what happens inside your border is yours to set.
intro: |
  Protection is the boring half of a claim. The fun half is deciding that nobody burns, nobody fights, or that everybody keeps their inventory.
icon: REDSTONE_TORCH
category: Land & building
order: 4
module: claims
aliases: [flags, flag, rules, pvp, fire, explosions, keepinventory, mobs-claim]
keywords: [monster, spawning, tnt, creeper, fall damage, hunger, elytra, teleport, visitors, trusted, owners, forced, locked]
related: [claims, claim-people, claim-perks]
sections:
  - question: What are rules?
    title: Rules and flags
    text: |
      A rule (staff call it a <i>flag</i>) decides what happens inside a claim: can players hurt each other, does fire spread, do monsters spawn, do creepers break blocks, do you take fall damage. Each one is on or off, and the owner decides — as far as the server lets them.
  - question: Where do I set them?
    title: Setting a rule
    text: |
      Open the claim ({run:/claim here} while standing in it), click <b>Configuration</b>, then <b>Claim flags</b>. Rules are sorted into groups — players, nature, creatures, pickups, travel, the border, machinery and death — and a group shows how many of its rules you changed.
      <b>Left-click</b> a rule to set it for everybody at once. A rule about people can also differ by audience: <b>right-click</b> it to set owners, trusted players and visitors separately. A half-filled symbol means the three groups disagree.
      <b>Follow the server again</b> forgets your choice and goes back to the default.
  - question: Which rules are about people?
    title: Per audience
    text: |
      Rules that concern what players do — PvP, damage from mobs and explosions, fall damage, hunger, potions, picking up items and experience, handling animals, walking in, teleporting in, ender pearls, keeping your inventory on death, totems, equipment wear and being seen from outside — carry one value each for owners, trusted players and visitors. So you can let your friends fight each other but not strangers.
      Rules about the <i>world</i> — fire, leaf decay, pistons, fluids, spawning — are the same for everybody. A patch of leaves cannot decay for visitors only.
  - question: Can I make a claim PvP-free?
    title: PvP
    text: |
      If PvP is offered to owners, flip it in the rule list. When it is off, hitting someone inside the claim is refused with a short message ("Fighting is not allowed in …"). Because it is per audience you can allow fights among the trusted while visitors stay safe.
  - question: What can I do about monsters?
    title: Monsters and animals
    text: |
      Rules in the creatures group: monster spawning, animal spawning, spawner spawning, mobs spawning from potions (silverfish, slimes), monsters walking in, mobs griefing, endermen picking up blocks, breeding, leads, boats and minecarts, and whether players may hurt animals, fight monsters or handle (shear, milk, saddle) creatures.
  - question: What about fire, explosions and water?
    title: Nature
    text: |
      Nature rules: fire spreading, leaves decaying, snow and ice forming, explosions damaging blocks, and fluids flowing at all. In the border group: whether pistons and fluids from <i>outside</i> may push into your claim. A claim that is safe from creepers and lava griefers is a pleasant claim.
  - question: Can I keep my inventory when I die?
    title: Death
    text: |
      The death group holds keep inventory, items dropping on death, and totems of undying. If the server lets owners decide, you can make your claim a place where nobody loses their gear. Whether it is on by default is up to the server.
  - question: What do the travel rules do?
    title: Travel
    text: |
      Walk in (can anyone cross the border), teleport in, ender pearls in, elytra flying and riptide tridents. Turning off walk-in is how you build a claim nobody can enter by foot — combine with the trusted list and you have a private club. Teleporting in also decides whether people can use your claim's warp (see {topic:claim-warps}).
  - question: Why can't I change some rules?
    title: Locked rules
    text: |
      The server has three ways to take a rule away from owners: <b>forced on</b> (always allowed), <b>forced off</b> (always denied) and <b>disabled</b> (not enforced — vanilla behaviour, and it simply does not appear). A locked rule says "decided by the server". Everything else is <b>available</b>: yours to change.
      Every rule also has a default that new claims start with; owners can only change it for their own claim, existing claims are not touched when staff change the default.
  - question: What is "ignoring my own rules"?
    title: Ignore my rules
    text: |
      The claim menu, if you are an owner, has a switch that excuses <i>you</i> from the claim's rules while you work on it — handy when a rule would otherwise get in your own way. It applies to this claim only and ends when the server restarts. Click again to follow your own rules once more.
